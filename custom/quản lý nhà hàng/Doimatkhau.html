<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="Doimatkhau.css">
</head>
<body>
    <div id="main-frame">
        <!-- Header có các menu theo bản vẽ -->
        <div id="header-bar">
            <div id="logo">Gemori</div>
            <div id="menu">
                <a href="#">Trang chủ</a>
                <a href="Khuyenmai.html">Khuyến mãi</a>
                <a href="#">Thực đơn</a>
            </div>
        </div>

        <div id="profile-container">
            <!-- Sidebar Trái -->
            <div id="sidebar">
                <div class="user-card">
                    <span class="avatar-large">👤</span>
                    <div>
                        <span class="user-name">Nguyễn Văn A</span>
                        <span class="user-role">Thành viên</span>
                    </div>
                </div>

                <div class="sidebar-menu">
                    <a href="canhan.html" class="menu-item">👤 Thông tin cá nhân</a>
                    <a href="Doimatkhau.html" class="menu-item active">🔑 Đổi mật khẩu</a>
                </div>
            </div>

            <!-- Khung Đổi mật khẩu theo đúng phác thảo -->
            <div id="main-content">
                <h2 class="page-title">Đổi mật khẩu</h2>

                <form id="form-doimatkhau">
                    <div class="input-group">
                        <label for="old-pass">Mật khẩu cũ</label>
                        <input type="password" id="old-pass" placeholder="••••••••" required>
                    </div>

                    <div class="input-group">
                        <label for="new-pass">Mật khẩu mới</label>
                        <input type="password" id="new-pass" placeholder="••••••••" required>
                    </div>

                    <div class="input-group">
                        <label for="confirm-pass">Nhập lại mật khẩu mới</label>
                        <input type="password" id="confirm-pass" placeholder="••••••••" required>
                    </div>

                    <!-- Hàng nút bấm: Đổi mật khẩu & Hủy -->
                    <div class="button-group">
                        <button type="submit" id="btn-save-pass">Đổi mật khẩu</button>
                        <a href="canhan.html" class="btn-cancel">Hủy</a>
                    </div>
                </form>
            </div>
        </div>

        <!-- Footer -->
        <div id="footer">
            <div id="footer-logo">Gemori</div>
            <div id="footer-links">
                <a href="#">Điều khoản</a>
                <a href="#">Bảo mật</a>
                <a href="#">Trợ giúp</a>
            </div>
        </div>
    </div>
</body>
</html>
