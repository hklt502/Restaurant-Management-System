<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang đăng nhập</title>
    <link rel="stylesheet" href="Dnhap.css">
</head>
<body>
    <div id="main-frame">
        <div id="header-bar">
            <div id="logo">Gemori</div>
            
            <div id="nav-right">
                <a href="Dki.html" class="nav-login">Đăng ký</a>
                <a href="#" class="btn-hotro">Hỗ trợ</a>
            </div>
        </div>

        <div id="container">
            <div id="form-logo">Gemori</div>
            <h2>Chào mừng trở lại</h2>
            <p id="subtitle">Đăng nhập để nhận ưu đãi độc quyền dành riêng cho thành viên</p>
            
            <form>
                <div id="nhapdulieu">
                    <div id="sdt">
                        <label for="phone">Số điện thoại</label>
                        <input type="text" id="phone" placeholder="......." required>
                    </div>
                    
                    <div id="matkhau">
                        <div class="label-pass">
                            <label for="password">Mật khẩu</label>
                            <a href="Doimatkhau.html" class="forgot-link">Quên mật khẩu?</a>
                        </div>
                        <input type="password" id="password" placeholder="......" required>
                    </div>
                </div>

                <button type="submit" id="Dangnhapngay">Đăng nhập ngay</button>
            </form>

            <div id="register">
                Chưa có tài khoản thành viên?<a href="Dki.html">Đăng ký thành viên</a>
            </div>
        </div>
    </div>
</body>
</html>
