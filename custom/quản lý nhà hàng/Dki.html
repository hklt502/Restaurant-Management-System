<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRANG ĐĂNG KÍ</title>
    <link rel="stylesheet" href="Dki.css">
</head>
<body>
    <div id="main-frame">
        <div id="header-bar">
            <div id="logo">Gemori</div>
           
            <div id="nav-right">
                <a href="dangnhap.html" class="nav-login">Đăng nhập</a>
                <a href="#" class="btn-hotro">Hỗ trợ</a>
            </div>
        </div>
   <div id="container">
    <h2>Đăng ký hội viên</h2>
    <p id="subtitle">Trở thành một phần của cộng đồng Gemori và nhận các ưu đãi đặc quyền</p>
    <form>
        <div id="nhapdulieu">
            <div id="hovaten">
                <label for="fullname">Họ và tên</label>
                <input type="text" id="fullname" placeholder="Nhập họ và tên" required>
            </div>
            <div id="nhapemail">
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="example@gmail.com" required>
            </div>
            <div id="sdt">
                <label for="phone">Số điện thoại</label>
                <input type="text" id="phone" placeholder="0xxx xxx xxx" required>
            </div>
            <div id="birthday">
                <label for="birth">Ngày tháng năm sinh</label>
                <input type="date" id="birth" required>
            </div>
            <div id="gender">
                <label>Giới tính</label>
                <div id="gender-block">
                    <label class="gender-option"><input type="radio" name="gender" value="nam" checked>Nam </label>
                    <label class="gender-option"><input type="radio" name="gender" value="nu">Nữ </label>
                    <label class="gender-option"><input type="radio" name="gender" value="khac">Khác </label>
            </div>
        </div>
        <div id="matkhau">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="......" required>
        </div>
        <div id="confirm">
            <label for="confirm-password">Xác nhận mật khẩu</label>
            <input type="password" id="confirm-password" placeholder="......" required>
        </div>
        </div>
        <div id="checkbox-block">
            <input type="checkbox" id="terms" required>
            <label for="terms">Tôi đồng ý với các <a href="#">Điều khoản dịch vụ</a> và <a href="#">Chính sách bảo mật </a> của Gemori.</label>
        </div>
        <button type="submit" id="Dangnhapngay">Tạo tài khoản ngay</button>
    </form>
    <div id="login-text">
        Bạn đã cố tài khoản?<a href="dangnhap.html">Đăng nhập tại đây</a>
    </div>
   </div>
   
</body>
</html>
